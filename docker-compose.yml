name: taxi-rio

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: taxi_root
      MYSQL_DATABASE: taxi
      MYSQL_USER: taxi
      MYSQL_PASSWORD: taxi
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-utaxi', '-ptaxi']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: taxi_audit
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 5s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: taxi
      RABBITMQ_DEFAULT_PASS: taxi
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 15

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_USER: taxi
      MYSQL_PASSWORD: taxi
      MYSQL_DATABASE: taxi
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://taxi:taxi@rabbitmq:5672
      JWT_PUBLIC_KEY_PATH: /app/keys/test-public.pem
    volumes:
      - ./keys/test-public.pem:/app/keys/test-public.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://taxi:taxi@rabbitmq:5672
      MONGODB_URI: mongodb://mongo:27017/taxi_audit
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  mysql_data:
  mongo_data:
