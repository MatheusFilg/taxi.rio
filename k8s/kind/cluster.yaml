# Portas no host **diferentes do compose** (8080/3000/9090) para não colidir
# com `docker compose up` ou outros stacks (ex.: Airflow em :8080).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: taxi-rio
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
      - containerPort: 30000
        hostPort: 13000
        protocol: TCP
      - containerPort: 30090
        hostPort: 19090
        protocol: TCP
