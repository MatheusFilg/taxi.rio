# Mesmas portas do docker compose — use só se 8080, 3000 e 9090 estiverem livres:
# KIND_CONFIG=k8s/kind/cluster-compose-ports.yaml bash k8s/scripts/kind-deploy.sh
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: taxi-rio
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30000
        hostPort: 3000
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
