apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taxi
resources:
  - namespace.yaml
  - configmap-taxi-app.yaml
  - mysql.yaml
  - redis.yaml
  - mongo.yaml
  - rabbitmq.yaml
  - api.yaml
  - worker.yaml
  - ui.yaml
configMapGenerator:
  - name: mysql-init
    files:
      - 01-init.sql=config/init.sql
  - name: jwt-public
    files:
      - test-public.pem=config/test-public.pem
  - name: rabbitmq-config
    files:
      - rabbitmq.conf=config/rabbitmq-k8s.conf
      - enabled_plugins=config/enabled_plugins
generatorOptions:
  disableNameSuffixHash: true
