# ConfigMap — valores não secretos (hosts DNS in-cluster, OTel, paths).
apiVersion: v1
kind: ConfigMap
metadata:
  name: taxi-app
  labels:
    app.kubernetes.io/part-of: taxi-rio
data:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: taxi
  REDIS_URL: redis://redis:6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  MONGODB_URI: mongodb://mongo:27017/taxi_audit
  JWT_PUBLIC_KEY_PATH: /app/keys/test-public.pem
  # OTEL opcional no kind mínimo (Tempo só no compose Parte 2):
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME_API: api
  OTEL_SERVICE_NAME_WORKER: worker
  API_PORT: "3000"
  WORKER_PORT: "3001"
