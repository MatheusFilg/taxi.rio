apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do sleep 2; done"]
        - name: wait-rabbit
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do sleep 2; done"]
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
      containers:
        - name: api
          image: taxi-rio-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: taxi-app
                  key: API_PORT
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: taxi-app
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: taxi-app
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: taxi-app
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: taxi-credentials
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taxi-credentials
                  key: MYSQL_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: taxi-app
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: taxi-credentials
                  key: RABBITMQ_URL
            - name: JWT_PUBLIC_KEY_PATH
              valueFrom:
                configMapKeyRef:
                  name: taxi-app
                  key: JWT_PUBLIC_KEY_PATH
            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: taxi-app
                  key: OTEL_SERVICE_NAME_API
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: taxi-app
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          volumeMounts:
            - name: jwt-public
              mountPath: /app/keys/test-public.pem
              subPath: test-public.pem
              readOnly: true
          resources:
            # API Bun: CPU no spike de POST; memória do bundle ~128–256 Mi em dev.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: jwt-public
          configMap:
            name: jwt-public
